name: Python application # name is basically what is my workflow name

# Trigger the workflow on any push to the main branch or pull request
on: # All events will be under on keyword
  push: # event no 1
    branches: [ "main" ]
  pull_request: # event no 2
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest # container that runs an entire application and test it

    steps: # workflow steps
      # step1: is to check the code from the repo
    - name: Check out code
      uses: actions/checkout@v1 # prebuilt action which checkout action
      # step2: is to setup python environment
    - name: Set up python
      uses: actions/setup-python@v1 # prebuilt action which creates python version
      with:
        python-version: "3.10"
      # step3: install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # step4: run tests
    - name: Run tests
      run: pytest
    
